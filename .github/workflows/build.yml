name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone the repo
        uses: actions/checkout@v5

      - name: Update, install deps and build
        run: ./build.sh
        timeout-minutes: 25

      - name: Smoke test
        run: ./dist/conway 5

      - name: Upload executable
        uses: actions/upload-artifact@v5
        with:
          name: conway-linux-x86_64
          path: |
            dist/conway
            dist/conway-linux-x86_64.tar.gz
