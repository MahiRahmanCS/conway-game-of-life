name: Build

on:
  push:            # every commit on any branch, and every pushed tag
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone the repo
        uses: actions/checkout@v5

      - name: Update, install deps and build
        run: ./build.sh
        timeout-minutes: 25

      - name: Smoke test
        run: ./dist/conway 5

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: conway-linux-x86_64
          path: |
            dist/conway
            dist/conway-linux-x86_64.tar.gz

  # Runs only when a tag like v1.0 is pushed: publishes a GitHub release
  # with the zip produced by the build job attached.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: conway-linux-x86_64
          path: dist

      - name: Zip the build
        run: cd dist && zip conway-linux-x86_64.zip conway conway-linux-x86_64.tar.gz

      - name: Create release, or attach files if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/conway-linux-x86_64.zip dist/conway-linux-x86_64.tar.gz"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $FILES --repo "$GITHUB_REPOSITORY" \
              --title "Amazing Conway's Game of Life $GITHUB_REF_NAME" --generate-notes
          fi
